name: Release

on:
  # 手动触发（发布演练 / 补发）；亦可用打 tag 触发
  workflow_dispatch:
    inputs:
      version:
        description: "发布版本（x.y.z；留空则用仓库当前版本）"
        required: false
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # ① 干净环境校验：安装 / 版本一致 / 许可清单 / 测试 / 构建（含 Rust）
  verify:
    runs-on: windows-latest
    env:
      RUST_BACKTRACE: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.10.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Version consistency (3 files)
        run: pnpm version:check

      - name: Licenses report (tooling)
        run: pnpm licenses:gen

      - name: Lint
        run: pnpm lint

      - name: Frontend tests
        run: pnpm test

      - name: Frontend build (tsc + vite)
        run: pnpm build

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

  # ② 打包：Windows nsis 为主（其余平台 best-effort / 不支持，见 README）
  bundle:
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.10.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 打包（nsis 安装包）：`tauri build` 内含打包阶段
      # 等价于 `tauri bundle --bundles nsis`（仅打包，不重新编译）
      - name: Build bundle (nsis)
        run: pnpm tauri build --bundles nsis

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: fatequill-nsis
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  # ③ 发布：打 tag 时附带产物到 GitHub Release
  release:
    needs: bundle
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download installer artifact
        uses: actions/download-artifact@v4
        with:
          name: fatequill-nsis
          path: dist-artifacts

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist-artifacts/*.exe
          body_path: CHANGELOG.md
          draft: false
